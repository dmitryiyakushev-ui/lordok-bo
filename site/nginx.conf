# HTTP → HTTPS redirect
server {
    listen 80;
    server_name lor-dok.ru www.lor-dok.ru;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name lor-dok.ru www.lor-dok.ru;

    ssl_certificate /etc/letsencrypt/live/lor-dok.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lor-dok.ru/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Landing page at /
    location = / {
        try_files /index.html =404;
    }

    # Legal documents and any other static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}
