services:
  bot:
    build: .
    container_name: lordok_bot
    restart: unless-stopped
    env_file: .env
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://lordok:lordok_secret@127.0.0.1:5432/lordok_db
      REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - ./data:/app/data  # persistent storage for exports, logs

  postgres:
    image: postgres:15-alpine
    container_name: lordok_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lordok
      POSTGRES_PASSWORD: lordok_secret
      POSTGRES_DB: lordok_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lordok -d lordok_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lordok_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: lordok_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  pgdata:
